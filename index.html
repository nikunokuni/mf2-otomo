<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- D12: ピンチズームは禁止しない（maximum-scale は付けない） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="モンスターファーム2の技の使い込みと育成計算をまとめて管理できるアプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="モンファーのおとも">
  <!-- D13: manifest.json の theme_color と必ず同じ値にすること -->
  <meta name="theme-color" content="#378add">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.svg">
  <link rel="icon" href="assets/icon-192.svg" type="image/svg+xml">
  <title>モンファーのおとも</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/monster.css">
  <link rel="stylesheet" href="css/tracker.css">
  <link rel="stylesheet" href="css/simulator.css">
  <link rel="stylesheet" href="css/reference.css">
</head>
<body>

<div class="app">

  <!-- ===== 上位タブ ===== -->
  <div class="tabbar" role="tablist" aria-label="表示の切り替え">
    <button type="button" class="tabbar__btn" id="tab-monster" role="tab"
            aria-selected="true" aria-controls="pane-monster"
            data-action="tab:top" data-tab="monster">モンスター</button>
    <button type="button" class="tabbar__btn" id="tab-tracker" role="tab"
            aria-selected="false" aria-controls="pane-tracker"
            data-action="tab:top" data-tab="tracker">使い込み</button>
    <button type="button" class="tabbar__btn" id="tab-simulator" role="tab"
            aria-selected="false" aria-controls="pane-simulator"
            data-action="tab:top" data-tab="simulator">育成計算</button>
    <button type="button" class="tabbar__btn" id="tab-reference" role="tab"
            aria-selected="false" aria-controls="pane-reference"
            data-action="tab:top" data-tab="reference">早見</button>
  </div>

  <!-- 選択中の種族。早見タブは種族に関係ないので、そのときだけ隠す -->
  <div id="speciesBar" class="species-bar">
    <div id="speciesChips" class="chips"></div>
  </div>

  <!-- ===== モンスタータブ ===== -->
  <div id="pane-monster" role="tabpanel" aria-labelledby="tab-monster">

    <div id="migrationNotice" class="callout callout--ok" hidden>
      以前の「使い込みトラッカー」の記録を引き継ぎました。
    </div>

    <div class="card">
      <div class="section-head">モンスターを選ぶ</div>
      <button type="button" class="btn btn--primary btn--block" id="speciesGridToggle"
              data-action="species:toggleGrid" aria-expanded="false" aria-controls="speciesGrid"
      >＋ 種族を選んで追加</button>
      <div class="monster-grid" id="speciesGrid" hidden></div>
    </div>

    <div id="monsterEmpty" class="card">
      <div class="empty">「＋ 種族を選んで追加」から種族を選んでください</div>
    </div>

    <!-- そのモンスター1体ぶんの決まった値。使い込みタブと育成計算タブの両方が使う -->
    <div id="monsterSpec" class="card" hidden>
      <div class="section-head">
        <span id="specSpeciesLabel"></span>
        <span class="note">のデータ</span>
      </div>

      <div class="sim-section">
        <div class="sim-section__title">成長設定</div>
        <!-- 成長タイプ / 寿命 / ヨイワル の3つを1行に収める -->
        <div class="spec-grid">
          <div class="field">
            <label for="simGtype">成長タイプ</label>
            <select id="simGtype" data-change="sim:gtype">
              <option value="hayajuku">早熟</option>
              <option value="jizoku">持続</option>
              <option value="futsuu">普通</option>
              <option value="bansei">晩成</option>
            </select>
          </div>
          <div class="field">
            <label for="simLife">寿命（週）</label>
            <!-- 250〜500 を10きざみ。中身は js/monster.js で作る -->
            <select id="simLife" data-change="sim:life"></select>
          </div>
          <div class="field">
            <label for="simMoral">ヨイワル</label>
            <!-- -100〜100 を5きざみ。中身は js/monster.js で作る -->
            <select id="simMoral" data-change="sim:moral"></select>
          </div>
        </div>
      </div>

      <div class="sim-section">
        <div class="sim-row">
          <label for="gutsRecovery" style="white-space:nowrap">ガッツ回復</label>
          <select id="gutsRecovery" data-change="tracker:guts" style="width:70px;height:30px"></select>
        </div>
      </div>

      <div class="sim-section">
        <div class="sim-section__title">初期パラと適正</div>
        <div id="initStats"></div>
      </div>

      <div class="sim-section">
        <div class="sim-section__title">エサの好き嫌い</div>
        <div class="feed-like-grid" id="feedLikeGrid"></div>
      </div>
    </div>
  </div>

  <!-- ===== 使い込みタブ ===== -->
  <div id="pane-tracker" role="tabpanel" aria-labelledby="tab-tracker" hidden>

    <div id="trackerEmpty" class="card">
      <div class="empty">「モンスター」タブから種族を選んでください</div>
    </div>

    <!-- 技の選択 -->
    <div id="techPickerCard" class="card" hidden>
      <div class="section-head">使い込む技を選択</div>
      <div id="techPickerList" class="tech-picker"></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button type="button" class="btn btn--primary" data-action="tracker:applyPick">選択を確定</button>
        <button type="button" class="btn" data-action="tracker:cancelPick">キャンセル</button>
        <span id="techPickerCount" class="note"></span>
      </div>
    </div>

    <div id="trackerMain" hidden>
      <div class="card">
        <div class="section-head">
          <span id="trackerSpeciesLabel"></span>
          <span id="sessionBadge" class="badge">大会なし</span>
          <button type="button" class="btn btn--sm btn--primary" id="changeTechBtn"
                  data-action="tracker:openPicker" style="margin-left:auto">技を変更</button>
        </div>

        <div class="scroll-x">
          <table class="table">
            <thead>
              <tr>
                <th>技名（下位→上位）</th>
                <th>累計</th>
                <th>今回</th>
                <th>消費G</th>
                <th class="th-hit">理想<br>命中</th>
                <th class="th-miss">理想<br>外れ</th>
              </tr>
            </thead>
            <tbody id="techBody"></tbody>
          </table>
        </div>

        <div id="sessionControls" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>

      <div class="card">
        <div class="section-head">履歴</div>
        <div id="logArea"></div>
      </div>

      <div class="card">
        <div class="section-head">メモ</div>
        <textarea id="memo" data-input="tracker:memo" style="min-height:100px"
          placeholder="自由にメモできます"></textarea>
      </div>
    </div>
  </div>

  <!-- ===== 育成計算タブ ===== -->
  <div id="pane-simulator" role="tabpanel" aria-labelledby="tab-simulator" hidden>

    <div id="simEmpty" class="card">
      <div class="empty">「モンスター」タブから種族を選んでください</div>
    </div>

    <div id="simBody" hidden>
      <div class="card">
        <div class="section-head">
          <span id="simSpeciesLabel"></span>
          <span class="note">の育成計画</span>
        </div>

        <div class="subtabs" role="tablist" aria-label="育成計算の表示切り替え">
          <button type="button" class="subtabs__btn" id="subtab-plan" role="tab"
                  aria-selected="true" aria-controls="subpane-plan"
                  data-action="tab:sub" data-tab="plan">育成計画</button>
          <button type="button" class="subtabs__btn" id="subtab-rotation" role="tab"
                  aria-selected="false" aria-controls="subpane-rotation"
                  data-action="tab:sub" data-tab="rotation">調整ローテ</button>
          <button type="button" class="subtabs__btn" id="subtab-result" role="tab"
                  aria-selected="false" aria-controls="subpane-result"
                  data-action="tab:sub" data-tab="result">結果</button>
        </div>

        <!-- 育成計画 -->
        <div id="subpane-plan" role="tabpanel" aria-labelledby="subtab-plan">
          <div class="sim-section">
            <div class="sim-section__title">育成開始時期</div>
            <div class="sim-row">
              <input type="number" id="simMonth" min="1" max="12" data-input="sim:month"
                     style="width:60px" aria-label="開始月">
              <span class="sim-label">月</span>
              <select id="simWeek" data-change="sim:week" style="width:80px" aria-label="開始週">
                <option value="1">第1週</option>
                <option value="2">第2週</option>
                <option value="3">第3週</option>
                <option value="4">第4週</option>
              </select>
              <span class="note">から育て始める</span>
            </div>
          </div>

          <!-- 成長適正は上昇値に効くので、計画を組みながら見えるようにしておく
               （書き換えるのはモンスタータブ） -->
          <div id="planApt" class="plan-apt"></div>

          <div id="planWarnings" style="margin:6px 0"></div>
          <div id="planArea"></div>
          <div class="peach" id="peachArea"></div>
        </div>

        <!-- 調整ローテ（育成計画の短期詳細版。これから作る） -->
        <div id="subpane-rotation" role="tabpanel" aria-labelledby="subtab-rotation" hidden>
          <div id="rotationArea"></div>
        </div>

        <!-- 結果 -->
        <div id="subpane-result" role="tabpanel" aria-labelledby="subtab-result" hidden>
          <div id="resultArea"></div>
        </div>

        <div class="sim-actions" id="simActions">
          <button type="button" class="btn btn--primary" data-action="sim:calc">計算実行</button>
          <button type="button" class="btn btn--ng" data-action="sim:reset">リセット</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 早見タブ ===== -->
  <div id="pane-reference" role="tabpanel" aria-labelledby="tab-reference" hidden>
    <div id="referenceArea"></div>
  </div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
